name: CI

# The full check, split so its parts run side by side: the fast tier with the source and generated-file checks, the
# integration tier, and the recipe kit's own tests. Stretch is checked out beside Squash, where the composite build finds it.
# A pull request that changes only Markdown (outside the generated docs/reference/) skips them; the required checks then pass.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  STRETCH_REF: main
  # Stretch's wgpu-native bindings come from GitHub Packages, which needs a token even for public packages.
  ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
  ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # code=false only on a pull request whose changed files are all Markdown outside docs/reference/. When this job fails its output
  # is empty, so every check below runs in full.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            tools/ci-changed-code.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  fast:
    name: Fast tier and source checks
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: squash
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: squash/kit/package-lock.json
      - run: npm ci
        working-directory: squash/kit
      - uses: gradle/actions/setup-gradle@v5
      - run: xvfb-run --auto-servernum ./gradlew checkFast --continue
        working-directory: squash
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fast-test-reports
          path: |
            squash/**/build/reports/tests
            squash/**/build/test-results
            squash/**/build/reports/checkTestSources.txt

  # The integration tier in shards that run side by side. The named shards each take the modules listed in their gradle-args; the
  # last shard, "rest", runs every other module's integrationTest by excluding the named ones, so a module added later falls into
  # it and no test goes unrun. When a module is added to a named shard, add its exclusion to "rest" below. The app's tests are split
  # by package, the two app shards being complements (--tests a pattern, -PintegrationExclude the same pattern).
  integration-shard:
    name: Integration shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app shell package
            gradle-args: :app:integrationTest --tests 'dev.chieppa.squash.screens.shell.*'
          - name: app other packages
            gradle-args: :app:integrationTest -PintegrationExclude='dev.chieppa.squash.screens.shell.*'
          - name: surface and draw
            gradle-args: :screens-surface:integrationTest :screens-draw:integrationTest
          - name: shell and sheet
            gradle-args: :screens-shell:integrationTest :screens-sheet:integrationTest
          - name: rest
            gradle-args: integrationTest -x :app:integrationTest -x :screens-surface:integrationTest -x :screens-draw:integrationTest -x :screens-shell:integrationTest -x :screens-sheet:integrationTest
    steps:
      - uses: actions/checkout@v7
        with:
          path: squash
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: xvfb-run --auto-servernum ./gradlew ${{ matrix.gradle-args }} --continue
        working-directory: squash
      - name: Test counts and times
        if: always()
        run: tools/ci-test-summary.sh integrationTest
        working-directory: squash
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-reports-${{ strategy.job-index }}
          path: |
            squash/**/build/reports/tests
            squash/**/build/test-results

  # The check the main ruleset requires: green when the changed files were read and every shard passed, or was skipped for a
  # Markdown-only change.
  integration:
    name: Integration tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, integration-shard]
    if: always()
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.integration-shard.result }}
        run: |
          echo "changes $CHANGES, code '$CODE', shards $SHARDS"
          test "$CHANGES" = success
          test "$SHARDS" = success || { test "$CODE" = false && test "$SHARDS" = skipped; }

  kit:
    name: Recipe kit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

name: CI

# The full check, split so its parts run side by side: the fast tier with the source and generated-file checks, the
# integration tier, and the recipe kit's own tests. Stretch is checked out beside Squash, where the composite build finds it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STRETCH_REF: main

jobs:
  fast:
    name: Fast tier and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: squash
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: squash/kit/package-lock.json
      - run: npm ci
        working-directory: squash/kit
      - uses: gradle/actions/setup-gradle@v5
      - run: xvfb-run --auto-servernum ./gradlew checkFast --continue
        working-directory: squash
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fast-test-reports
          path: |
            squash/**/build/reports/tests
            squash/**/build/test-results
            squash/**/build/reports/checkTestSources.txt

  # The integration tier in shards that run side by side. The named shards each take the modules listed in their gradle-args; the
  # last shard, "rest", runs every other module's integrationTest by excluding the named ones, so a module added later falls into
  # it and no test goes unrun. When a module is added to a named shard, add its exclusion to "rest" below.
  integration-shard:
    name: Integration shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            gradle-args: :app:integrationTest
          - name: surface and draw
            gradle-args: :screens-surface:integrationTest :screens-draw:integrationTest
          - name: shell and sheet
            gradle-args: :screens-shell:integrationTest :screens-sheet:integrationTest
          - name: rest
            gradle-args: integrationTest -x :app:integrationTest -x :screens-surface:integrationTest -x :screens-draw:integrationTest -x :screens-shell:integrationTest -x :screens-sheet:integrationTest
    steps:
      - uses: actions/checkout@v7
        with:
          path: squash
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: xvfb-run --auto-servernum ./gradlew ${{ matrix.gradle-args }} --continue --no-build-cache
        working-directory: squash
      - name: Test counts and times
        if: always()
        run: tools/ci-test-summary.sh integrationTest
        working-directory: squash
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-reports-${{ strategy.job-index }}
          path: |
            squash/**/build/reports/tests
            squash/**/build/test-results

  # The check the main ruleset requires: green only when every shard is.
  integration:
    name: Integration tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: integration-shard
    if: always()
    steps:
      - run: test "${{ needs.integration-shard.result }}" = success

  kit:
    name: Recipe kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

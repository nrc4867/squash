kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# Four workers: test JVMs of different modules run side by side, and the heaviest modules fork more than one (maxParallelForks),
# each test JVM at most 1 GB of heap. Normal priority, because on a CPU with efficiency cores Windows keeps below-normal
# processes on those cores, where the tests run several times slower.
org.gradle.workers.max=4
org.gradle.priority=normal
